[project]
name = "battery-market-dispatch"
version = "0.1.0"
description = "Battery dispatch optimisation against two wholesale electricity markets"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "openpyxl",
    "pulp",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
